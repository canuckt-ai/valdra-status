name: uptime check

# Runs on GitHub's infrastructure, NOT ours. That is the whole point: when the OVH
# estate is down — precisely when a status page matters — the checker and the page both
# keep working. A status page hosted on the servers it reports on is decoration.
#
# This repo is deliberately PUBLIC so Actions minutes are unlimited and free. It holds
# only uptime results; there is nothing here worth keeping private.

on:
  schedule:
    # GitHub does not honour this. Measured median gap: 82 minutes, worst 194.
    # It is kept as a SLOW INDEPENDENT FALLBACK — if @wp (which does the real
    # 10-minute probing) goes down, this still eventually reports the truth from
    # infrastructure we do not own.
    - cron: '*/10 * * * *'
  workflow_dispatch:          # manual run, for testing

  # NO push trigger. There used to be one so that every data commit republished the page.
  # That was the bug: ~144 Pages deployments a day of an HTML shell that never changes.
  # On 2026-08-06 it wedged — deployments queued and timed out for hours, the page froze
  # at 11:39 while the prober kept working, and every failure emailed the founder.
  #
  # Publishing is now branch-based and needs no workflow at all: Pages serves index.html
  # from the repo root on push, and the live numbers are fetched client-side from
  # raw.githubusercontent.com. So this workflow's ONLY remaining job is to be a slow,
  # independent fallback prober for the case where @wp itself dies.

# Only `contents: write`, to commit fallback samples. The pages/id-token permissions went
# with the deploy job — nothing here talks to the Pages deployment API any more.
permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need the `data` branch as well as main

      # Carry the accumulated samples forward before probing. probe.py READS history.json
      # and appends to it, so starting from main's stale snapshot would silently reset the
      # uptime history instead of extending it.
      - name: Load existing samples from the data branch
        run: |
          git fetch -q origin data || exit 0
          git checkout -q origin/data -- public/data/ || true

      - name: Probe endpoints
        run: python3 scripts/probe.py

      # Samples go to the `data` branch, never to `main` — same reason as
      # scripts/probe-cron.sh. A push to `main` makes GitHub Pages republish, and it was
      # republishing ~144 times a day that jammed Pages on 2026-08-06.
      - name: Commit result
        run: |
          git config user.name  "valdra-status"
          git config user.email "status@valdra.ai"
          git add public/data/
          # Nothing to commit is normal if a run produced no change.
          git diff --staged --quiet && exit 0
          git commit -m "uptime: $(date -u +%Y-%m-%dT%H:%MZ) (fallback probe)"
          git push -f origin HEAD:data

# ── Publishing ────────────────────────────────────────────────────────────────
# NO deploy job. status.valdra.ai is published by GitHub Pages directly from the
# `main` branch root, not from an Actions artifact.
#
# WHY (2026-08-06): the artifact + actions/deploy-pages path failed hard. Two
# deployments landed a minute apart at 11:39/11:40, one jammed, and from then on
# every deployment sat in `deployment_queued` until it timed out. Cancelling the
# stuck one let deployments be created again but they still never completed, so
# nothing could publish for hours. Meanwhile the page kept serving frozen 11:39
# numbers while the prober was working perfectly, which is the single worst thing
# a status page can do.
#
# Root cause was cadence: republishing on every data commit meant ~144 Pages
# deployments a day of an HTML shell that never changes.
#
# Now: the shell is a plain file at the repo root, and the live data is fetched
# client-side from raw.githubusercontent.com (see the RAW note in index.html).
# Branch publishing needs no deployment lock, so there is nothing left to wedge
# and nothing left to email about. This job therefore only probes.
#
# Editing the page: change index.html at the repo root. Pages picks it up on push.
