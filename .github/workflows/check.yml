name: uptime check

# Runs on GitHub's infrastructure, NOT ours. That is the whole point: when the OVH
# estate is down — precisely when a status page matters — the checker and the page both
# keep working. A status page hosted on the servers it reports on is decoration.
#
# This repo is deliberately PUBLIC so Actions minutes are unlimited and free. It holds
# only uptime results; there is nothing here worth keeping private.

on:
  schedule:
    # GitHub does not honour this. Measured median gap: 82 minutes, worst 194.
    # It is kept as a SLOW INDEPENDENT FALLBACK — if @wp (which does the real
    # 10-minute probing) goes down, this still eventually reports the truth from
    # infrastructure we do not own.
    - cron: '*/10 * * * *'
  workflow_dispatch:          # manual run, for testing
  # The real cadence comes from @wp pushing results every 10 minutes. A PUSH
  # trigger is NOT throttled the way a schedule is, so this deploys the new data
  # to Pages within about a minute of the probe running.
  push:
    branches: [main]
    paths: ['public/**']

permissions:
  contents: write
  pages: write
  id-token: write

# CANCEL, do not queue. @wp pushes every 10 minutes and a run takes 2-8 minutes, so
# with cancel-in-progress:false the queue grows faster than it drains. On 2026-08-06 two
# deployments landed a minute apart (11:39 and 11:40), GitHub Pages wedged, and every
# deployment after that sat in `deployment_queued` until it timed out. The page kept
# serving, but frozen at 11:39 while the probe carried on committing fresh data.
#
# A superseded uptime deploy has zero value: the run behind it carries strictly newer
# data. Cancelling is therefore free, and it makes the pileup impossible rather than
# merely unlikely. The probe itself lives on @wp, so a cancelled run loses no samples.
concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a push the data is already fresh — @wp just probed and committed it.
      # Probing again would only add a redundant sample and risk a push race.
      - name: Probe endpoints
        if: github.event_name != 'push'
        run: python3 scripts/probe.py

      - name: Commit result
        if: github.event_name != 'push'
        run: |
          git config user.name  "valdra-status"
          git config user.email "status@valdra.ai"
          git add public/data/
          # Nothing to commit is normal if a run produced no change.
          git diff --staged --quiet || git commit -m "uptime: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed first; rebase rather than fail the check.
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Published by GitHub Pages, not Cloudflare Pages. Same property that matters — the
  # page is served from infrastructure entirely separate from the estate it reports on,
  # so it survives an outage. Deployed from the artifact above rather than a branch
  # folder, because Pages branch sources only allow / or /docs and the site lives in
  # public/.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A job-level cap as well as the action's own timeout. Without this a wedged Pages
    # deployment holds the concurrency slot for its full default 10 minutes, which is
    # longer than the gap between probes — so the backlog can never drain on its own.
    timeout-minutes: 6
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10 min). Pages normally publishes in well under a minute;
          # if it has not finished in three, it is stuck, and failing fast lets the next
          # run take a clean slot instead of inheriting the jam.
          timeout: 180000
